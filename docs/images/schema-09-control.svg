<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="700" viewBox="0 0 1140 700">
<rect width="1140" height="700" fill="#ffffff"/>
<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1c1d21">Схема 9 – Принципна схема на управление</text>
<text x="24" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6c757d">Логика на приоритетите и блокировките между източниците</text>
<line x1="24" y1="64" x2="1116" y2="64" stroke="#dee2e6" stroke-width="1.5"/>
<rect x="40" y="100" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T1 буфер – горе</text>
<rect x="40" y="146" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T2 буфер – среда</text>
<rect x="40" y="192" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T3 буфер – долу</text>
<rect x="40" y="238" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T4 колектор</text>
<rect x="40" y="284" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T5 подаване</text>
<rect x="40" y="330" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T6 връщане</text>
<rect x="40" y="376" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T7 камина</text>
<rect x="40" y="422" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T8 БГВ</text>
<rect x="40" y="468" width="190" height="32" rx="5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="135" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">T9 външна</text>
<rect x="300" y="100" width="190" height="410" rx="10" fill="#fff" stroke="#7048e8" stroke-width="2" opacity="1"/>
<text x="395" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5f3dc4" text-anchor="middle" font-weight="bold" font-style="normal">КОНТРОЛЕР</text>
<rect x="316" y="150" width="158" height="42" rx="5" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" opacity="1"/>
<text x="395" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="middle" font-weight="normal" font-style="normal">Сравнение T4−T3</text>
<rect x="316" y="210" width="158" height="42" rx="5" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" opacity="1"/>
<text x="395" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="middle" font-weight="normal" font-style="normal">Приоритет БГВ</text>
<rect x="316" y="270" width="158" height="42" rx="5" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" opacity="1"/>
<text x="395" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="middle" font-weight="normal" font-style="normal">Отоплителна крива</text>
<rect x="316" y="330" width="158" height="42" rx="5" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" opacity="1"/>
<text x="395" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="middle" font-weight="normal" font-style="normal">Зонов контрол</text>
<rect x="316" y="390" width="158" height="42" rx="5" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" opacity="1"/>
<text x="395" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="middle" font-weight="normal" font-style="normal">Разрешение за пелети</text>
<rect x="316" y="450" width="158" height="42" rx="5" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" opacity="1"/>
<text x="395" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="middle" font-weight="normal" font-style="normal">Защити и аварии</text>
<polyline points="490,115 560,115" fill="none" stroke="#7048e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="525.0,115.0 515.1,119.8 515.1,110.2" fill="#7048e8"/>
<rect x="560" y="100" width="190" height="32" rx="5" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="655" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">P1 соларна помпа</text>
<polyline points="490,175 560,175" fill="none" stroke="#7048e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="525.0,175.0 515.1,179.8 515.1,170.2" fill="#7048e8"/>
<rect x="560" y="160" width="190" height="32" rx="5" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="655" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">M2 приоритет БГВ</text>
<polyline points="490,235 560,235" fill="none" stroke="#7048e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="525.0,235.0 515.1,239.8 515.1,230.2" fill="#7048e8"/>
<rect x="560" y="220" width="190" height="32" rx="5" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="655" y="241" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">P2 отоплителна помпа</text>
<polyline points="490,295 560,295" fill="none" stroke="#7048e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="525.0,295.0 515.1,299.8 515.1,290.2" fill="#7048e8"/>
<rect x="560" y="280" width="190" height="32" rx="5" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="655" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">M1 трипътен смесител</text>
<polyline points="490,355 560,355" fill="none" stroke="#7048e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="525.0,355.0 515.1,359.8 515.1,350.2" fill="#7048e8"/>
<rect x="560" y="340" width="190" height="32" rx="5" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="655" y="361" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">Y1–Y3 зони</text>
<polyline points="490,415 560,415" fill="none" stroke="#7048e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="525.0,415.0 515.1,419.8 515.1,410.2" fill="#7048e8"/>
<rect x="560" y="400" width="190" height="32" rx="5" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="655" y="421" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">P4 пелети / P3 камина</text>
<rect x="790" y="100" width="330" height="230" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.2" opacity="1"/>
<text x="955" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#495057" text-anchor="middle" font-weight="bold" font-style="normal">ЛОГИКА НА ПРИОРИТЕТИТЕ</text>
<text x="806" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">1. БГВ под 50 °C → солар и буфер към бойлера</text>
<text x="806" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">2. Буфер под 45 °C → пелети/камина</text>
<text x="806" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">3. Буфер над 60 °C → пелетите са блокирани</text>
<text x="806" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">4. Излишък → буфер до 90 °C, после покрив</text>
<text x="806" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">5. Нощно охлаждане при стагнация</text>
<rect x="790" y="360" width="330" height="250" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.2" opacity="1"/>
<text x="955" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#a61e1e" text-anchor="middle" font-weight="bold" font-style="normal">ЗАЩИТИ И БЛОКИРОВКИ</text>
<text x="806" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a61e1e" text-anchor="start" font-weight="normal" font-style="normal">• T4 &gt; 110 °C → помпа максимум</text>
<text x="806" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a61e1e" text-anchor="start" font-weight="normal" font-style="normal">• T4 &lt; 4 °C → антифризна защита</text>
<text x="806" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a61e1e" text-anchor="start" font-weight="normal" font-style="normal">• T7 &gt; 95 °C → охлаждащ кръг</text>
<text x="806" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a61e1e" text-anchor="start" font-weight="normal" font-style="normal">• Няма дебит 60 s → авария</text>
<text x="806" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a61e1e" text-anchor="start" font-weight="normal" font-style="normal">• Няма комуникация → локален режим</text>
<text x="806" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a61e1e" text-anchor="start" font-weight="normal" font-style="normal">• Пелети: блокирани при T1 &gt; 60 °C</text>
<text x="1116" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
</svg>