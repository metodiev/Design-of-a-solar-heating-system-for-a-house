<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700">
<rect width="1080" height="700" fill="#ffffff"/>
<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1c1d21">Схема 6 – Бойлер 200 l с две серпентини</text>
<text x="24" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6c757d">Серпентина 1 – соларна; серпентина 2 – от буфера; приоритет на БГВ; защита срещу легионела</text>
<line x1="24" y1="64" x2="1056" y2="64" stroke="#dee2e6" stroke-width="1.5"/>
<rect x="420" y="110" width="160" height="330" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5" opacity="1"/>
<text x="500" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="bold" font-style="normal">БОЙЛЕР R2BC 200</text>
<text x="500" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#2b8a3e" text-anchor="middle" font-weight="normal" font-style="normal">200 l · 2 серпентини</text>
<circle cx="500" cy="210" r="26" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
<text x="500" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="bold" font-style="normal">S1</text>
<text x="500" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle" font-weight="normal" font-style="normal">соларна</text>
<circle cx="500" cy="330" r="26" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
<text x="500" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle" font-weight="bold" font-style="normal">S2</text>
<text x="500" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c92a2a" text-anchor="middle" font-weight="normal" font-style="normal">от буфера</text>
<polyline points="300,180 420,180" fill="none" stroke="#e8590c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360.0,180.0 350.1,184.8 350.1,175.2" fill="#e8590c"/>
<polyline points="420,240 300,240" fill="none" stroke="#f08c00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360.0,240.0 369.9,235.2 369.9,244.8" fill="#f08c00"/>
