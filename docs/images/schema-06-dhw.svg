<polyline points="300,330 420,330" fill="none" stroke="#c92a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360.0,330.0 350.1,334.8 350.1,325.2" fill="#c92a2a"/>
<polyline points="420,360 300,360" fill="none" stroke="#1971c2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360.0,360.0 369.9,355.2 369.9,364.8" fill="#1971c2"/>
<text x="300" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c92a2a" text-anchor="start" font-weight="normal" font-style="normal">от буфера (T1)</text>
<polygon points="340,319 330,337 350,337" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
<text x="340" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c92a2a" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="340" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#c92a2a" text-anchor="middle" font-weight="normal" font-style="normal">приоритет</text>
<polyline points="580,160 660,160 660,120 900,120" fill="none" stroke="#2f9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="780.0,120.0 770.1,124.8 770.1,115.2" fill="#2f9e44"/>
<text x="780" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="normal" font-style="normal">БГВ 50 °C</text>
<polygon points="700,149 690,167 710,167" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
<text x="700" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2f9e44" text-anchor="middle" font-weight="bold" font-style="normal">TMV</text>
<text x="700" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#2b8a3e" text-anchor="middle" font-weight="normal" font-style="normal">термостат. смесител 45–50 °C</text>
<polyline points="580,220 640,220 640,175 690,175" fill="none" stroke="#0c8599" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="665.0,175.0 655.1,179.8 655.1,170.2" fill="#0c8599"/>
<text x="640" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#0c8599" text-anchor="middle" font-weight="normal" font-style="normal">студена вода</text>
<polyline points="580,430 620,430 620,460 700,460" fill="none" stroke="#2f9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="660.0,460.0 650.1,464.8 650.1,455.2" fill="#2f9e44"/>
<circle cx="740" cy="460" r="13" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
<polygon points="735,454 735,466 746,460" fill="#2f9e44"/>
<text x="740" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle" font-weight="normal" font-style="normal">рециркулация</text>
<polyline points="760,460 900,460" fill="none" stroke="#2f9e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="830.0,460.0 820.1,464.8 820.1,455.2" fill="#2f9e44"/>
<rect x="60" y="430" width="240" height="90" rx="8" fill="#fff" stroke="#0c8599" stroke-width="1.8" opacity="1"/>
<text x="180.0" y="470.5" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold" font-style="normal">Предпазна група БГВ</text>
<text x="180.0" y="487.5" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" font-style="normal">6 bar + 8 l съд + клапан 90 °C</text>
<polyline points="300,470 420,470 420,415" fill="none" stroke="#0c8599" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="420.0,442.5 424.8,452.4 415.2,452.4" fill="#0c8599"/>
<rect x="60" y="550" width="470" height="90" rx="8" fill="#fff" stroke="#c92a2a" stroke-width="1.8" opacity="1"/>
<text x="295.0" y="582.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle" font-weight="bold" font-style="normal">Легионела: седмично загряване до 65 °C</text>
<text x="295.0" y="599.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" font-style="normal">чрез серпентина 2 (буфер/пелети) в 03:00–05:00</text>
<text x="295.0" y="616.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" font-style="normal">и промиване на рециркулацията до 60 °C</text>
<rect x="560" y="520" width="470" height="99" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.2" opacity="1"/>
<text x="570" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Ефективност на серпентините: 0,85</text>
<text x="570" y="553" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Мощност S1: 8–12 kW при ΔT 30 K</text>
<text x="570" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Мощност S2: 6–9 kW при ΔT 25 K</text>
<text x="570" y="583" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Приоритет: ако T(БГВ) &lt; 50 °C → трипътният вентил</text>
<text x="570" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">спира отоплението и зарежда само бойлера.</text>
<text x="1056" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
