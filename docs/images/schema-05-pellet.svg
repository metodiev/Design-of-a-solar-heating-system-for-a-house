<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
<rect width="1080" height="620" fill="#ffffff"/>
<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1c1d21">Схема 5 – Интеграция на пелетното отопление</text>
<text x="24" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6c757d">Вариант А: зареждане на буфера (препоръчан) · Вариант Б: резервен източник към отоплението</text>
<line x1="24" y1="64" x2="1056" y2="64" stroke="#dee2e6" stroke-width="1.5"/>
<rect x="60" y="120" width="200" height="100" rx="8" fill="#fff" stroke="#f08c00" stroke-width="1.8" opacity="1"/>
<text x="160.0" y="157.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" font-style="normal">ПЕЛЕТЕН УРЕД</text>
<text x="160.0" y="174.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" font-style="normal">6–12 kW</text>
<text x="160.0" y="191.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" font-style="normal">модулация 30–100 %</text>
<text x="160" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a94a0a" text-anchor="middle" font-weight="italic" font-style="normal">типът се потвърждава (котел/камена печка)</text>
<polyline points="260,145 330,145" fill="none" stroke="#f08c00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="295.0,145.0 285.1,149.8 285.1,140.2" fill="#f08c00"/>
<circle cx="370" cy="145" r="13" fill="#fff" stroke="#f08c00" stroke-width="2"/>
<polygon points="365,139 365,151 376,145" fill="#f08c00"/>
<circle cx="420" cy="145" r="12" fill="#fff" stroke="#f08c00" stroke-width="1.5"/>
<text x="420" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a94a0a" text-anchor="middle" font-weight="bold" font-style="normal">V</text>
<rect x="457" y="120" width="26" height="20" rx="4" fill="#fff" stroke="#a94a0a" stroke-width="1.5" opacity="1"/>
<text x="470" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a94a0a" text-anchor="middle" font-weight="bold" font-style="normal">T7</text>
<polyline points="432,145 560,145" fill="none" stroke="#f08c00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="496.0,145.0 486.1,149.8 486.1,140.2" fill="#f08c00"/>
<rect x="560" y="110" width="120" height="300" rx="10" fill="#dee2e6" stroke="#343a40" stroke-width="2" opacity="1"/>
<text x="620" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold" font-style="normal">БУФЕР</text>
<text x="620" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle" font-weight="normal" font-style="normal">800 l</text>
<polyline points="620,410 620,450 300,450 300,190 260,190" fill="none" stroke="#1971c2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="280.0,190.0 289.9,185.2 289.9,194.8" fill="#1971c2"/>
<text x="300" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1971c2" text-anchor="start" font-weight="normal" font-style="normal">връщане към пелетния уред – защита от конденз (≥ 55 °C)</text>
<rect x="740" y="110" width="290" height="150" rx="10" fill="#fff9db" stroke="#f59f00" stroke-width="1.2" opacity="1"/>
<text x="885" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="middle" font-weight="bold" font-style="normal">ВАРИАНТ А – зареждане на буфера</text>
<text x="754" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Уредът работи винаги на номинал</text>
<text x="754" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Буферът е хидравличен разделител</text>
<text x="754" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• По-малко цикли, по-висок КПД</text>
<text x="754" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Изисква обем ≥ 55 l/kW</text>
<rect x="740" y="280" width="290" height="150" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.2" opacity="1"/>
<text x="885" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#495057" text-anchor="middle" font-weight="bold" font-style="normal">ВАРИАНТ Б – резервен към отоплението</text>
<text x="754" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">• Уредът подава директно към кръга</text>
<text x="754" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">• По-евтина инсталация</text>
<text x="754" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">• Работи при ниска температура</text>
<text x="754" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="start" font-weight="normal" font-style="normal">• Само при изчерпан буфер</text>
<text x="540" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle" font-weight="italic" font-style="normal">Логика: пелетният уред се разрешава само ако T1(буфер) &lt; 45 °C за 30 min и няма достатъчно слънце/камина.</text>
<text x="1056" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
</svg>