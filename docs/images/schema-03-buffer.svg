<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700">
<rect width="1080" height="700" fill="#ffffff"/>
<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1c1d21">Схема 3 – Буферен съд 800 l с всички връзки</text>
<text x="24" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6c757d">9 шуцера G 6/4", три температурни нива, стратификация, изолация 100 mm</text>
<line x1="24" y1="64" x2="1056" y2="64" stroke="#dee2e6" stroke-width="1.5"/>
<rect x="360" y="100" width="200" height="470" rx="14" fill="#dee2e6" stroke="#343a40" stroke-width="2.5" opacity="1"/>
<rect x="348" y="92" width="224" height="486" rx="16" fill="none" stroke="#868e96" stroke-width="1.2" opacity="1"/>
<text x="460" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold" font-style="normal">PS 800 N+</text>
<text x="460" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle" font-weight="normal" font-style="normal">Ø 790 mm · H 1694 mm</text>
<text x="460" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle" font-weight="normal" font-style="normal">800 l · 9 × G 6/4"</text>
<line x1="360" y1="120" x2="300" y2="120" stroke="#e8590c" stroke-width="5"/>
<text x="292" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="end" font-weight="normal" font-style="normal">1  Соларен кръг – подаване (ТО)</text>
<line x1="360" y1="200" x2="300" y2="200" stroke="#c92a2a" stroke-width="5"/>
<text x="292" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="end" font-weight="normal" font-style="normal">2  Камина – подаване</text>
<line x1="360" y1="280" x2="300" y2="280" stroke="#f08c00" stroke-width="5"/>
<text x="292" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="end" font-weight="normal" font-style="normal">3  Пелети – подаване</text>
<line x1="360" y1="360" x2="300" y2="360" stroke="#c92a2a" stroke-width="5"/>
<text x="292" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="end" font-weight="normal" font-style="normal">4  Отопление – подаване (T5)</text>
<line x1="360" y1="440" x2="300" y2="440" stroke="#c92a2a" stroke-width="5"/>
<text x="292" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="end" font-weight="normal" font-style="normal">5  Бойлер – серпентина 2</text>
<line x1="360" y1="520" x2="300" y2="520" stroke="#f08c00" stroke-width="5"/>
<text x="292" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="end" font-weight="normal" font-style="normal">6  Соларен кръг – връщане</text>
<line x1="620" y1="560" x2="680" y2="560" stroke="#f08c00" stroke-width="5"/>
<text x="688" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">7  Пелети – връщане</text>
<line x1="620" y1="600" x2="680" y2="600" stroke="#1971c2" stroke-width="5"/>
<text x="688" y="604" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">8  Камина – връщане</text>
<line x1="620" y1="640" x2="680" y2="640" stroke="#1971c2" stroke-width="5"/>
<text x="688" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">9  Отопление – връщане (T4)</text>
<rect x="447" y="170" width="26" height="20" rx="4" fill="#fff" stroke="#862e9c" stroke-width="1.5" opacity="1"/>
<text x="460" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#862e9c" text-anchor="middle" font-weight="bold" font-style="normal">T1</text>
<text x="492" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#862e9c" text-anchor="start" font-weight="normal" font-style="normal">горен</text>
<rect x="447" y="330" width="26" height="20" rx="4" fill="#fff" stroke="#862e9c" stroke-width="1.5" opacity="1"/>
<text x="460" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#862e9c" text-anchor="middle" font-weight="bold" font-style="normal">T2</text>
<text x="492" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#862e9c" text-anchor="start" font-weight="normal" font-style="normal">среден</text>
<rect x="447" y="530" width="26" height="20" rx="4" fill="#fff" stroke="#862e9c" stroke-width="1.5" opacity="1"/>
<text x="460" y="544" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#862e9c" text-anchor="middle" font-weight="bold" font-style="normal">T3</text>
<text x="492" y="544" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#862e9c" text-anchor="start" font-weight="normal" font-style="normal">долен</text>
<path d="M390 520 L390 300" stroke="#f08c00" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<path d="M530 520 L530 170" stroke="#f08c00" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<text x="460" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#e8590c" text-anchor="middle" font-weight="italic" font-style="normal">зона на стратификация (ΔT ≈ 15–25 K)</text>
<rect x="700" y="100" width="330" height="190" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.2" opacity="1"/>
<text x="865" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle" font-weight="bold" font-style="normal">ТОПЛИНЕН КАПАЦИТЕТ</text>
<text x="716" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">C = 800 kg × 4,186 kJ/kg·K = 3 349 kJ/K</text>
<text x="716" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">= 0,93 kWh/K</text>
<text x="716" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">Q(40→80 °C) = 37,2 kWh</text>
<text x="716" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">Автономия при 5 kW: ≈ 7,4 h (ΔT 40 K)</text>
<text x="716" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">Загуби: UA ≈ 2,0 W/K → 1,5 kWh/ден</text>
<rect x="700" y="320" width="330" height="210" rx="10" fill="#fff9db" stroke="#f59f00" stroke-width="1.2" opacity="1"/>
<text x="865" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#664d03" text-anchor="middle" font-weight="bold" font-style="normal">ИЗИСКВАНИЯ</text>
<text x="716" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Изолация мин. 100 mm (0,035 W/m·K)</text>
<text x="716" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• 3 датчика: 1/3, 2/3 и горна част</text>
<text x="716" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Шуцери с вътрешни ланцеви тръби</text>
<text x="716" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Дренаж и обезвъздушител най-горе</text>
<text x="716" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Фундамент за 900 kg работна маса</text>
<text x="716" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Предпазен клапан 3 bar на всеки кръг</text>
<text x="1056" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
</svg>