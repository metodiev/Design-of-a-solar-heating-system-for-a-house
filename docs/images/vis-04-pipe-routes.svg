<text x="240" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="middle" font-weight="bold" font-style="normal">ПРАВИЛА ЗА ТРАСЕТАТА</text>
<text x="76" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">• Соларен кръг: непрекъснат наклон нагоре</text>
<text x="76" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">  към обезвъздушителя (≥ 2 %)</text>
<text x="76" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">• Всички хоризонтални участъци – с</text>
<text x="76" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">  обезвъздушител в най-високата точка</text>
<text x="76" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">• Изолация: 20 mm солар, 30–40 mm отопление</text>
<text x="76" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">• Компенсатори на всеки ≥ 8 m прав участък</text>
<text x="1096" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
