<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
<rect width="1120" height="720" fill="#ffffff"/>
<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1c1d21">Схема 8 – Електрическа схема на автоматиката</text>
<text x="24" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6c757d">Захранване, защити, контролер, изпълнителни механизми и датчици</text>
<line x1="24" y1="64" x2="1096" y2="64" stroke="#dee2e6" stroke-width="1.5"/>
<rect x="40" y="100" width="150" height="520" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" opacity="1"/>
<text x="115" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5f3dc4" text-anchor="middle" font-weight="bold" font-style="normal">ЗАХРАНВАНЕ</text>
<rect x="55" y="149" width="120" height="26" rx="4" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="115" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">230 V AC / 50 Hz</text>
<rect x="55" y="189" width="120" height="26" rx="4" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="115" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">Автомат C16</text>
<rect x="55" y="229" width="120" height="26" rx="4" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="115" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">Дефектнотокова</text>
<rect x="55" y="247" width="120" height="26" rx="4" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="115" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">защита 30 mA</text>
<rect x="55" y="294" width="120" height="26" rx="4" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="115" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">UPS 12 V/300 W</text>
<rect x="55" y="334" width="120" height="26" rx="4" fill="#fff" stroke="#7048e8" stroke-width="1.2" opacity="1"/>
<text x="115" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5f3dc4" text-anchor="middle" font-weight="normal" font-style="normal">Заземяване</text>
<rect x="220" y="100" width="260" height="520" rx="10" fill="#fff" stroke="#7048e8" stroke-width="2" opacity="1"/>
<text x="350" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5f3dc4" text-anchor="middle" font-weight="bold" font-style="normal">КОНТРОЛЕР</text>
<text x="350" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="middle" font-weight="bold" font-style="normal">IR 12 THERM2 SOL</text>
<text x="234" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="9.6" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">T1–T3  буфер (горен/среден/долен)</text>
