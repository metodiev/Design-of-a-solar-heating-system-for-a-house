<text x="855" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">• 3 етажа × радиатори</text>
<text x="855" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">• Зонов вентил на етаж</text>
