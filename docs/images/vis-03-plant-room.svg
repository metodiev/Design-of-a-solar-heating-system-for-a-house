<text x="76" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="bold" font-style="normal">ТЕГЛО И ФУНДАМЕНТ</text>
<text x="76" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Буфер 800 l: ~150 kg + 800 kg вода + 60 kg арматура</text>
<text x="76" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">→ 1 050 kg върху ~0,5 m² → min 2,1 kN/m²</text>
<rect x="560" y="90" width="460" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.2" opacity="1"/>
<text x="576" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1864ab" text-anchor="start" font-weight="bold" font-style="normal">ВЕНТИЛАЦИЯ И ДОСТЪП</text>
<text x="576" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="start" font-weight="normal" font-style="normal">Отвор за всмукване на въздух ≥ 200 cm²</text>
<text x="576" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="start" font-weight="normal" font-style="normal">Свободен достъп 0,6 m пред всеки уред</text>
<text x="1056" y="668" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
