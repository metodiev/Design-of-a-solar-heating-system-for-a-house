<rect x="615" y="540" width="24" height="24" rx="3" fill="#fff" stroke="#c92a2a" stroke-width="1.4" opacity="1"/>
<text x="627" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#c92a2a" text-anchor="middle" font-weight="bold" font-style="normal">ZV</text>
<rect x="880" y="120" width="220" height="90" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.8" opacity="1"/>
<text x="990.0" y="152.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#212529" text-anchor="middle" font-weight="bold" font-style="normal">Балансиращи вентили</text>
<text x="990.0" y="169.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#212529" text-anchor="middle" font-weight="normal" font-style="normal">на всеки клон</text>
<text x="990.0" y="186.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#212529" text-anchor="middle" font-weight="normal" font-style="normal">предварителна настройка</text>
<text x="990" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6c757d" text-anchor="middle" font-weight="normal" font-style="normal">Δp ≈ 0,35 bar</text>
<rect x="60" y="430" width="480" height="210" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.2" opacity="1"/>
<text x="300" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle" font-weight="bold" font-style="normal">ПРОВЕРКА НА РАДИАТОРИТЕ</text>
<text x="76" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">ΔT_log(60/50) = 34,8 K  →  Q = 100 % (базово оразмеряване)</text>
<text x="76" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">ΔT_log(55/45) = 29,0 K  →  Q = 80 %</text>
<text x="76" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">ΔT_log(50/40) = 24,7 K  →  Q = 63 %</text>
<text x="76" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">ΔT_log(45/35) = 20,2 K  →  Q = 48 %</text>
<text x="76" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">Q = Q_n × (ΔT_log/ΔT_log,n)^1,3</text>
<rect x="580" y="430" width="520" height="210" rx="10" fill="#fff9db" stroke="#f59f00" stroke-width="1.2" opacity="1"/>
<text x="840" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#664d03" text-anchor="middle" font-weight="bold" font-style="normal">ИЗВОД ЗА ПРОЕКТИРАНЕТО</text>
<text x="596" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• При 45 °C подаване радиаторите дават ~48 % от мощността –</text>
<text x="596" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">  недостатъчно за 4,9 kW при −15 °C.</text>
<text x="596" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Работен режим: 55/45 °C при студено време,</text>
<text x="596" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">  40/35 °C при меко време (отоплителна крива).</text>
<text x="596" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Ако собственикът желае 40–45 °C: увеличете площта</text>
<text x="596" y="604" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">  на радиаторите ~2 пъти или добавете конвектори.</text>
<text x="1116" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
</svg>