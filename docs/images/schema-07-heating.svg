<rect x="585" y="480" width="24" height="24" rx="3" fill="#fff" stroke="#c92a2a" stroke-width="1.4" opacity="1"/>
<text x="597" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#c92a2a" text-anchor="middle" font-weight="bold" font-style="normal">ZV</text>
<rect x="540" y="575" width="300" height="50" rx="8" fill="#fff" stroke="#c92a2a" stroke-width="1.8" opacity="1"/>
