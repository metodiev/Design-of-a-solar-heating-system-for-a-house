<text x="880" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="middle" font-weight="bold" font-style="normal">КОНТРОЛ ПО ЕТАЖИ</text>
<text x="696" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Зонов вентил с електрозадвижка на всеки етаж</text>
<text x="696" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Стаен термостат / програматор</text>
<text x="696" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Термостатни глави на радиаторите</text>
<text x="696" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Балансиращ вентил на връщането</text>
<text x="696" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">• Възможност за нощно понижение по етаж</text>
<rect x="680" y="340" width="400" height="180" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.2" opacity="1"/>
<text x="880" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1864ab" text-anchor="middle" font-weight="bold" font-style="normal">ХИДРАВЛИЧНИ ДАННИ</text>
<text x="696" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="start" font-weight="normal" font-style="normal">Дебит отопление: 0,45 m³/h (ΔT 10 K)</text>
<text x="696" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="start" font-weight="normal" font-style="normal">Напор помпа: 2,5–3,5 m</text>
<text x="696" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="start" font-weight="normal" font-style="normal">Скорост в тръбите: 0,4–0,8 m/s</text>
<text x="696" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="start" font-weight="normal" font-style="normal">Δp радиаторен кръг: 0,25–0,40 bar</text>
<text x="1096" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
