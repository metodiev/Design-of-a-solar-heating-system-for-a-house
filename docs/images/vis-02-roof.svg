<text x="290" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle" font-weight="bold" font-style="normal">ГЕОМЕТРИЯ</text>
<text x="76" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">5 колектора: 3 + 2 (шахматно)</text>
<text x="76" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">Обща площ: 12,6 m² бруто / 11,5 m² апертура</text>
<text x="76" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">Наклон 55° → +8 % зимно производство</text>
<text x="76" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">Сянка между редове: ≥ 1,9 × h</text>
<text x="76" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#343a40" text-anchor="start" font-weight="normal" font-style="normal">Свободен покрив: ~22 m²</text>
<rect x="560" y="500" width="460" height="160" rx="10" fill="#fff9db" stroke="#f59f00" stroke-width="1.2" opacity="1"/>
<text x="790" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#664d03" text-anchor="middle" font-weight="bold" font-style="normal">МОНТАЖ</text>
<text x="576" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Шини на керемидите, без пробиване на хидроизолацията</text>
<text x="576" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Разстояние до комин: ≥ 0,6 m</text>
<text x="576" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Носеща способност: 25 kg/m² (пълни с гликол)</text>
<text x="576" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#664d03" text-anchor="start" font-weight="normal" font-style="normal">Достъп за обслужване: ≥ 0,5 m отстрани</text>
<text x="1056" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#868e96" text-anchor="end">Концептуална схема – не е проект за монтаж. Всички размери и свързвания подлежат на проверка от правоспособен проектант.</text>
